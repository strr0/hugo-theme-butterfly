{{/* 首页文章分类导航条（移植原版 layout/includes/categoryGroup.pug） */}}
<div id="categoryBar">
  <div id="category-bar" class="category-bar">
    <div id="catalog-bar">
      <div id="catalog-list">
        <div class="catalog-list-item" id="首页">
          <a href="{{ site.Home.RelPermalink }}">首页</a>
        </div>
        {{ range site.Taxonomies.categories.ByCount }}
          <div class="catalog-list-item" id="{{ .Page.Title }}">
            <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a>
          </div>
        {{ end }}
      </div>
      <div class="category-bar-next" id="category-bar-next" onclick="scrollCategoryBarToRight()">
        <i class="anzhiyufont anzhiyu-icon-angle-double-right"></i>
      </div>
      <a class="catalog-more" href="{{ "categories/" | relURL }}">更多</a>
    </div>
  </div>
</div>
