{{/* 本地搜索弹窗（原版 layout/includes/third-party/search/local-search.pug 移植） */}}
<div id="local-search">
  <div class="search-dialog">
    <nav class="search-nav">
      <span class="search-dialog-title">搜索</span>
      <span id="loading-status"></span>
      <button class="search-close-button" type="button">
        <i class="anzhiyufont anzhiyu-icon-xmark"></i>
      </button>
    </nav>
    <div id="loading-database" class="is-center">
      <i class="anzhiyufont anzhiyu-icon-spinner anzhiyu-pulse-icon"></i><span>  数据库加载中</span>
    </div>
    <div class="search-wrap">
      <div id="local-search-input">
        <div class="local-search-box">
          <input placeholder="搜索文章" type="text" class="local-search-box--input">
        </div>
      </div>
      <hr>
      <div id="local-search-results"></div>
    </div>
  </div>
  <div id="search-mask"></div>
</div>
