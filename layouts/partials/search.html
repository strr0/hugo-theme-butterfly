{{/* 本地搜索弹窗：结构照官方 Next 版 SearchModal（.searchDialog > .searchNav + .searchWrap），
   本地实现在索引上匹配，故无服务端分页；输入框左侧放大镜、下方快捷键提示为官方元素 */}}
<div id="local-search">
  <div class="search-dialog">
    <nav class="search-nav">
      <span class="search-dialog-title">搜索</span>
      <button class="search-close-button" type="button" aria-label="关闭搜索框">
        <i class="anzhiyufont anzhiyu-icon-xmark"></i>
      </button>
    </nav>
    <div class="search-wrap">
      <div class="search-input-container">
        <i class="anzhiyufont anzhiyu-icon-magnifying-glass search-icon"></i>
        <input id="search-input" class="search-input" type="text" placeholder="输入关键字，按 Enter 搜索">
      </div>
      <div class="search-tips" id="search-tips">
        <span>按 Esc 关闭</span>
        <span>·</span>
        <span>按 Ctrl/⌘ + K 打开</span>
      </div>
      <div id="loading-database" class="search-loading">
        <div class="search-loading-spinner"></div>
        <div class="search-loading-text">数据库加载中</div>
      </div>
      <div id="local-search-results"></div>
    </div>
  </div>
  <div id="search-mask"></div>
</div>
